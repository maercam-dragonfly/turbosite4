connection: doctrine
options:
  collate: utf8_unicode_ci
  charset: utf8
Category:
  tableName: categories
  columns:
    id:
      type: integer
      primary: true
      autoincrement: true
    name:
      type: string(50)
      notnull: true
Article:
  tableName: articles
  columns:
    id:
      type: integer
      primary: true
      autoincrement: true
    title:
      type: string(255)
    slug:
      type: string(255)
    content:
      type: string(1000)
    date:
      type: timestamp
      notnull: false
    category_id:
      type: integer
  relations:
    Category:
      class: Category
      foreign: id
      local: category_id
      type: many
      foreignType: one
      foreignAlias: Articles 
################################################################################     
Role:
  tableName: role
  columns:
    id:
      type: integer
      primary: true
      autoincrement: true
    name:
      type: string(50)
      notnull: true
  relations:
    User:
      class: User
      foreign: role_id
      local: id
      type: many

User:
  tableName: user
  columns:
    id:
      type: integer
      primary: true
      autoincrement: true
    login:
      type: string(50)
      notnull: true
    password:
      type: string(64)
      notnull: true
    email:
      type: string(70)
      notnull: true
    role_id:
      type: integer
  relations:
    Role:
      foreign: id
      local: role_id
################################################################################
CMS:
  tableName: cms
  columns:
    id:
      type: integer
      primary: true
      autoincrement: true
    name:
      type: string(255)
      notnull: true
    title:
      type: string(255)
      notnull: true
    content:
      type: string(600)
      notnull: true
    type:
      type: string(255)
      notnull: true
    active:
      type: bool
      notnull: true
###########################################################################
Gallery:
  tableName: galeries
  columns: 
    id:
      type: string(32)
      primary: true
      notnull: true
    name:
      type: string(50)
################################################################################   
QuizUser:
  tableName: quiz_users
  columns:
    id:
      type: integer
      fixed: false
      unsigned: true
      primary: true
      autoincrement: true
    imie:
      type: string(50)
      notnull: true
    nazwisko:
      type: string(50)
      notnull: true
    email:
      type: string(70)
      notnull: true
    telefon:
      type: string(10)
      notnull: true
    uwagi:
      type: string(300)
    wiek:
      type: integer
    created:
      type: timestamp
      notnull: false
    registered:
      type: bool
      notnull: true
Student:
  tableName: students
  columns:
    id:
      type: integer
      fixed: false
      unsigned: true
      primary: true
      autoincrement: true
    imie:
      type: string(50)
      notnull: true
    nazwisko:
      type: string(50)
      notnull: true
    rodzaj_kursu:
      type: integer
    pesel:
      type: string(11)
    miejsce_urodzenia:
      type: string(50)
    obywatelstwo:
      type: string(50)
    adres_zamieszkania:
      type: string(50)
    email:
      type: string(70)
      notnull: true
    telefon:
      type: string(10)
      notnull: true
    uwagi:
      type: string(300)
    created:
      type: timestamp
      notnull: false
    activated:
      type: bool
      notnull: true
    registered:
      type: bool
      notnull: true
    link:
      type: string(32)
      notnull: true
      